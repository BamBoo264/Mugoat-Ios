name: Build Mugoat Nova
on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build Release IPA after all checks
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: mugoat-nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          python3 tools/test_nova_integrity.py
      - name: Type-check all production Swift against the iPhone SDK
        run: |
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header app/Source/Native-Bridging-Header.h -I app/Source -I app/App/GameInstaller app/App/*.swift app/App/GameInstaller/*.swift
      - name: Check native graphics bridge C ABI before engine compilation
        run: |
          xcrun clang++ -std=c++20 -fobjc-arc -target arm64-apple-ios16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I app/Source -c app/Source/MetalGraphicsHost.mm -o "$RUNNER_TEMP/nova-graphics.o"
          nm -g "$RUNNER_TEMP/nova-graphics.o" | grep ' T _PGSetNovaOutput$'
      - name: Production PAD layout and spatial scaling tests
        run: |
          python3 tools/test_manual_layout.py "$RUNNER_TEMP"
          python3 tools/test_nova_scale.py "$RUNNER_TEMP"
      - name: Production language pack reader with memory sanitizers
        if: hashFiles('app/Resources/VietnameseAccented.nvp') != ''
        run: |
          clang -fobjc-arc -fsanitize=address,undefined -framework Foundation app/Source/NovaLanguagePack.m app/Tests/nova_pack.m -o "$RUNNER_TEMP/nova-pack"
          "$RUNNER_TEMP/nova-pack" "$PWD/app/Resources"
      - name: Production vehicle, skin and audio importer tests
        run: |
          python3 tools/prepare_ci_archive.py "$RUNNER_TEMP/host-archive"
          export PG_HOST_ARCHIVE="$PWD/app/Vendor/libarchive.xcframework/macos-arm64"
          python3 tools/extract_compatibility_test.py "$RUNNER_TEMP/compat.c"
          cd app
          clang -c App/GameInstaller/GameInstallerShim.c -I "$PG_HOST_ARCHIVE/Headers" -o "$RUNNER_TEMP/archive.o"
          clang -c Source/SoundInflate.c -o "$RUNNER_TEMP/inflate.o"
          clang -c Tests/SoundTestStubs.c -o "$RUNNER_TEMP/stubs.o"
          clang -c "$RUNNER_TEMP/compat.c" -o "$RUNNER_TEMP/compat.o"
          swiftc -import-objc-header Tests/SoundTestBridge.h -I App/GameInstaller App/ModInstaller.swift App/SoundArchive.swift App/SoundInstaller.swift App/SkinInstaller.swift App/ModVehicleSupport.swift App/BundledMenyoo.swift Tests/SoundTestStubs.swift Tests/nova_mod_import.swift "$RUNNER_TEMP/archive.o" "$RUNNER_TEMP/inflate.o" "$RUNNER_TEMP/stubs.o" "$RUNNER_TEMP/compat.o" "$PG_HOST_ARCHIVE/libarchive.a" -lz -lbz2 -o "$RUNNER_TEMP/nova-mod-import"
          "$RUNNER_TEMP/nova-mod-import"
      - name: Assemble checked original engine inputs
        if: inputs.build_ipa
        run: python3 app/Scripts/assemble_inputs.py --inputs . --out "$RUNNER_TEMP/game-files"
      - name: Install Xcode project generator and Metal compiler
        if: inputs.build_ipa
        run: |
          command -v xcodegen || brew install xcodegen
          xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          echo "PGMSL_PREBUILT_URL=file://$PWD/build-tools/pgmsl-macos-arm64.tar.gz" >> "$GITHUB_ENV"
      - name: Release IPA from original 1.4.4 native renderer
        if: inputs.build_ipa
        env:
          JOBS: "3"
        run: bash build_ipa.sh --mirror "$RUNNER_TEMP/game-files"
      - name: Verify paid-cert entitlements and Nova pack resources
        if: inputs.build_ipa
        run: |
          APP=app/Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app
          codesign -d --entitlements :- "$APP" 2>&1 | tee "$RUNNER_TEMP/entitlements.txt"
          test -s "$APP/VietnameseAccented.nvp"
          test -s "$APP/BundledMenyoo.zip"
          test -d "$APP/TurboSounds"
          shasum -a 256 Mugoat-Nova-N001.ipa
      - uses: actions/upload-artifact@v4
        if: success() && inputs.build_ipa
        with:
          name: Mugoat-Nova-N001
          path: Mugoat-Nova-N001.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Nova-build-diagnostics
          path: |
            app/Build/xcodebuild.log
            app/Generated/*.tsv
          retention-days: 7
