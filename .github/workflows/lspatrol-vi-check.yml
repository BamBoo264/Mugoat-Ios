          #include "NativeASI.h"
          #include <stdbool.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          
          static uint8_t *memory;
          static uint64_t next = 0x200000;
          static bool keys[256];
          
          static uint64_t allocate(uint64_t size) {
            uint64_t result = next;
            next += (size + 15) & ~15ull;
            if (next >= 128 * 1024 * 1024) abort();
            return result;
          }
          static void release(uint64_t address) { (void)address; }
          static void logLine(const char *line) { puts(line); fflush(stdout); }
          static bool key(int code) { return keys[code]; }
          static bool invoke(uint64_t hash, uint64_t args, uint32_t count, uint64_t result) {
            if (hash == 0xd80958fc74e988a6ull || hash == 0x7239b21a38f536baull || hash == 0x5e9564d8246b909aull ||
                hash == 0x35b9e0803292b641ull || hash == 0xc0296a2edf545e92ull ||
                hash == 0x75816577fea6dad5ull || hash == 0x19aac8f07bfec53eull) {
              memory[result] = 1;
            }
            if (hash == 0x9cd27b0045628463ull) { // GET_GAME_TIMER
              static uint32_t time;
              time += 20;
              memcpy(memory + result, &time, 4);
            }
            return true;
          }
          int main(int argc, char **argv) {
            if (argc != 3) return 2;
            memory = calloc(1, 128 * 1024 * 1024);
            PGAsiHost host = {.memory = memory, .size = 128 * 1024 * 1024, .alloc = allocate,
              .free = release, .log = logLine, .native = invoke, .key_down = key,
              .game_version = 2189, .files = argv[2]};
            if (!memory || !pg_asi_init(&host)) return 3;
            FILE *file = fopen(argv[1], "rb");
            if (!file || fseek(file, 0, SEEK_END)) return 4;
            long len = ftell(file);
            if (len < 1 || fseek(file, 0, SEEK_SET)) return 4;
            uint8_t *bytes = malloc(len);
            if (!bytes || fread(bytes, 1, len, file) != (size_t)len) return 4;
            fclose(file);
            if (!pg_asi_load("LSPatrol.asi", argv[2], bytes, len)) return 5;
            free(bytes);
            for (int frame = 0; frame < 1800; ++frame) {
              if (frame == 1400 || frame == 1401) {
                keys[0x79] = frame == 1400;
                pg_asi_key(0x79, keys[0x79]);
              }
              pg_asi_tick();
              usleep(3000);
            }
            PGAsiKeyInfo info = {0};
            pg_asi_key_info(&info);
            printf("Harness result: keyboard=%d menu=%d F10=%u\n",info.keyboardHandler,info.menuVisible,info.opens[0x79]);
            return 0;
          }
