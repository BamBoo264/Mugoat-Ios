name: Test localized LSPatrol F10 and dialogue
on:
  push:
    branches: [nova-lspatrol-localization-ci]
    paths: [".github/workflows/lspatrol-vi-check.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Blink for the headless startup test
        run: |
          mkdir "$RUNNER_TEMP/blink-objects"
          cd "$RUNNER_TEMP/blink-objects"
          vendor="$GITHUB_WORKSPACE/app/Vendor/blink"
          find "$vendor/blink" -maxdepth 1 -name '*.c' -print0 | xargs -0 -P 4 -n 1 clang -O2 -DNDEBUG -w -D_GNU_SOURCE -I"$vendor" -c
          ar rcs libblink.a ./*.o
      - name: Compare original LSPatrol ZIP on V7 and V8
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/lspatrol"
          mkdir "$scratch"
          cd "$scratch"
          curl --fail --location --retry 2 -sS 'https://files.gta5-mods.com/uploads/lspatrol-police-mod/71bc7c-LSPatrol-v0.5.zip' -o original.zip
          echo 'cfef9fc8ebb0e11cefffe1490d65a1ee3dc5078d6cfb0ade95a09ea3d80d5c54  original.zip' | shasum -a 256 -c
          python3 - <<'PY_LOCALIZE'
          import zipfile,base64,hashlib
